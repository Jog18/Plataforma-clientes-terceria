# Corre las pruebas en cada PR y en cada cambio a main.
# Render solo publica una versión nueva si esta revisión pasa (ver render.yaml).
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest backend/tests
